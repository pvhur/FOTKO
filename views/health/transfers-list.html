<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-5886476101959679">
  <title>이적 뉴스 — Kickoff</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27><path d=%27M10 2L17.32 6V14L10 18L2.68 14V6Z%27 stroke=%27%235e6ad2%27 stroke-width=%271.5%27 fill=%27none%27/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/kickoff.css" />
  <style>
    :root {
      --fire:        #ff6b00;
      --fire-bright: #ff9500;
      --fire-hot:    #ef4444;
      --ember:       #fbbf24;
      --fire-dim:    rgba(255,107,0,.1);
    }

    /* ── HERO ── */
    .tl-hero {
      padding: calc(56px + 32px) 0 28px;
      border-bottom: 1px solid var(--hairline);
      background: var(--canvas);
      position: relative;
      overflow: hidden;
    }
    .tl-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 80% at 50% 130%, rgba(255,107,0,.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .tl-hero-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .tl-hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--fire);
      margin-bottom: 8px;
    }
    .tl-live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--fire);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.7); }
    }
    .tl-hero-title {
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: -1.2px;
      color: var(--ink);
      margin: 0;
    }
    .tl-hero-sub {
      font-size: 13px;
      color: var(--ink-tertiary);
      margin-top: 6px;
    }
    .tl-count-badge {
      font-size: 13px;
      color: var(--ink-tertiary);
      align-self: flex-end;
      padding-bottom: 4px;
    }
    .tl-count-badge strong { color: var(--fire-bright); font-weight: 700; }

    /* ── LAYOUT ── */
    .tl-layout {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 24px;
      align-items: start;
      padding: 28px 0 60px;
    }

    /* ── TEAM SIDEBAR ── */
    .team-sidebar {
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,107,0,.2) transparent;
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: var(--r-xl);
      padding-bottom: 8px;
    }
    .team-sidebar::-webkit-scrollbar { width: 4px; }
    .team-sidebar::-webkit-scrollbar-thumb { background: rgba(255,107,0,.2); border-radius: 2px; }
    .ts-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0;
      background: var(--surface-1); z-index: 2;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
    }
    .ts-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-tertiary); }
    .ts-reset { font-size:11px; color:var(--fire); cursor:pointer; background:none; border:none; font-family:inherit; padding:0; opacity:0; transition:opacity .15s; }
    .ts-reset.visible { opacity:1; }
    .ts-league { border-bottom:1px solid var(--hairline); }
    .ts-league:last-child { border-bottom:none; }
    .ts-league-header { display:flex; align-items:center; gap:8px; padding:10px 14px 8px; cursor:pointer; user-select:none; transition:background .12s; }
    .ts-league-header:hover { background:var(--surface-2); }
    .ts-league-logo { width:18px; height:18px; object-fit:contain; flex-shrink:0; }
    .ts-league-name { font-size:12px; font-weight:700; color:var(--ink-muted); flex:1; }
    .ts-league-count { font-size:10px; color:var(--ink-tertiary); background:var(--surface-3); border-radius:9999px; padding:1px 6px; }
    .ts-chevron { color:var(--ink-tertiary); transition:transform .2s; flex-shrink:0; }
    .ts-league.collapsed .ts-chevron { transform:rotate(-90deg); }
    .ts-teams { padding:2px 0 8px; }
    .ts-league.collapsed .ts-teams { display:none; }
    .ts-team { display:flex; align-items:center; gap:9px; padding:6px 14px 6px 20px; cursor:pointer; transition:background .1s; position:relative; }
    .ts-team:hover { background:rgba(255,107,0,.06); }
    .ts-team.active { background:rgba(255,107,0,.1); }
    .ts-team.active::before { content:''; position:absolute; left:0; top:4px; bottom:4px; width:3px; background:var(--fire); border-radius:0 2px 2px 0; }
    .ts-team-logo { width:22px; height:22px; object-fit:contain; flex-shrink:0; }
    .ts-team-logo-fb { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; flex-shrink:0; background:rgba(255,107,0,.3); }
    .ts-team-name { font-size:12px; font-weight:500; color:var(--ink-muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ts-team.active .ts-team-name { color:var(--fire-bright); font-weight:600; }
    .ts-team-cnt { font-size:10px; color:var(--ink-tertiary); background:var(--surface-2); border-radius:9999px; padding:1px 5px; flex-shrink:0; }
    .ts-team.active .ts-team-cnt { background:rgba(255,107,0,.15); color:var(--fire); }

    /* ── HOT STRIP ── */
    .hot-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      margin-bottom: 18px;
    }
    .hot-strip::-webkit-scrollbar { display: none; }
    .hot-strip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--fire);
      white-space: nowrap;
      letter-spacing: .3px;
    }
    .hot-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: var(--fire-dim);
      border: 1px solid rgba(255,107,0,.2);
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 600;
      color: var(--fire-bright);
      white-space: nowrap;
      cursor: pointer;
      transition: background .14s, border-color .14s;
      text-decoration: none;
    }
    .hot-chip:hover {
      background: rgba(255,107,0,.2);
      border-color: rgba(255,107,0,.4);
    }

    /* ── FILTER BAR ── */
    .tl-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .tf-chip {
      padding: 5px 14px;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      cursor: pointer;
      transition: all .14s;
      user-select: none;
    }
    .tf-chip:hover { border-color: var(--hairline-strong); color: var(--ink); }
    .tf-chip.active {
      background: var(--fire-dim);
      border-color: rgba(255,107,0,.3);
      color: var(--fire-bright);
    }

    /* ── POST LIST ── */
    .post-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--hairline);
      border-radius: var(--r-xl);
      overflow: hidden;
      background: var(--surface-1);
    }
    .post-list-header {
      display: grid;
      grid-template-columns: 100px 1fr 100px 70px;
      gap: 12px;
      padding: 10px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--hairline);
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-tertiary);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .post-row {
      display: grid;
      grid-template-columns: 100px 1fr 100px 70px;
      gap: 12px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--hairline);
      cursor: pointer;
      transition: background .12s;
      text-decoration: none;
      color: inherit;
    }
    .post-row:last-child { border-bottom: none; }
    .post-row:hover { background: var(--surface-2); }

    .pr-badge { flex-shrink: 0; }
    .badge-rumor {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border-radius: var(--r-pill);
      font-size: 11px; font-weight: 600;
      background: rgba(251,191,36,.1); color: var(--ember);
      border: 1px solid rgba(251,191,36,.25);
    }
    .badge-official {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border-radius: var(--r-pill);
      font-size: 11px; font-weight: 600;
      background: rgba(255,107,0,.12); color: var(--fire-bright);
      border: 1px solid rgba(255,107,0,.25);
    }
    .badge-done {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border-radius: var(--r-pill);
      font-size: 11px; font-weight: 600;
      background: rgba(74,222,128,.1); color: #4ade80;
      border: 1px solid rgba(74,222,128,.2);
    }

    .pr-info {}
    .pr-player {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }
    .pr-hot-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--fire);
      background: var(--fire-dim);
      border: 1px solid rgba(255,107,0,.2);
      border-radius: var(--r-pill);
      padding: 1px 6px;
      letter-spacing: .3px;
    }
    .pr-route {
      font-size: 12px;
      color: var(--ink-tertiary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pr-route-arrow { color: var(--fire); font-weight: 700; }

    .pr-fee {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
    }
    .pr-fee.known { color: var(--fire-bright); }

    .pr-time {
      font-size: 11px;
      color: var(--ink-tertiary);
      text-align: right;
    }

    /* updated indicator */
    .pr-updated { color: var(--fire); font-weight: 600; }

    /* empty state */
    .post-list-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--ink-tertiary);
    }
    .post-list-empty .ple-icon { font-size: 36px; margin-bottom: 12px; }
    .post-list-empty p { font-size: 14px; }

    /* ── RIGHT SIDEBAR ── */
    .tl-sidebar {
      position: sticky;
      top: 72px;
    }
    .tls-panel {
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: var(--r-xl);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .tls-head {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--hairline);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tls-hot-list { padding: 8px 0; }
    .tls-hot-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background .12s;
      text-decoration: none;
      color: inherit;
    }
    .tls-hot-item:hover { background: var(--surface-2); }
    .tls-hot-rank {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-tertiary);
      width: 18px;
      flex-shrink: 0;
    }
    .tls-hot-rank.top { color: var(--fire); }
    .tls-hot-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      flex: 1;
    }
    .tls-hot-route {
      font-size: 11px;
      color: var(--ink-tertiary);
    }

    /* stats panel */
    .tls-stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--hairline);
      font-size: 13px;
    }
    .tls-stat-row:last-child { border-bottom: none; }
    .tls-stat-label { color: var(--ink-muted); }
    .tls-stat-val { font-weight: 700; color: var(--ink); }

    @media(max-width:1200px) {
      .tl-layout { grid-template-columns: 200px 1fr 240px; }
    }
    @media(max-width:1000px) {
      .tl-layout { grid-template-columns: 200px 1fr; }
      .tl-sidebar { display: none; }
    }
    @media(max-width:760px) {
      .tl-layout { grid-template-columns: 1fr; }
      .team-sidebar { position: static; max-height: 260px; }
    }
    @media(max-width:600px) {
      .post-list-header { display: none; }
      .post-row { grid-template-columns: 90px 1fr 60px; }
      .pr-fee { display: none; }
    }
  </style>
</head>

const LOGO       = id => `https://media.api-sports.io/football/teams/${id}.png`;

/* ── 상태 ── */
let _posts     = [];
let _filter    = 'all';

/* ── 유틸 ── */
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (m < 1)  return '방금 전';
  if (m < 60) return `${m}분 전`;
  if (h < 24) return `${h}시간 전`;
  if (d <  7) return `${d}일 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
}
function isNew(iso) { return Date.now() - new Date(iso).getTime() < 3 * 3600000; }

function teamMatch(p, name) {
  if (!name) return true;
  const n    = name.toLowerCase();
  const from = (p.from_team || '').toLowerCase();
  const to   = (p.to_team   || '').toLowerCase();
  return from.includes(n) || to.includes(n) ||
         n.includes(from.split(' ')[0]) || n.includes(to.split(' ')[0]);
}

/* ── 팀 사이드바 ── */
function renderSidebar() {
  const teamCount = {};
  _posts.forEach(p => {
    [p.from_team, p.to_team].forEach(club => {
      if (!club) return;
      const k = club.toLowerCase().trim();
      teamCount[k] = (teamCount[k] || 0) + 1;
    });
  });
  function getCount(name) {
    const k = name.toLowerCase().trim();
    if (teamCount[k]) return teamCount[k];
    const found = Object.keys(teamCount).find(x => x.includes(k) || k.includes(x));
    return found ? teamCount[found] : 0;
  }

  document.getElementById('teamLeagues').innerHTML = LEAGUES.map(league => {
    const lc = league.teams.reduce((s, t) => s + getCount(t.name), 0);
    return `
    <div class="ts-league collapsed" id="tl-league-${league.id}">
      <div class="ts-league-header" onclick="toggleLeague('${league.id}')">
        <img class="ts-league-logo" src="${LEAGUE_LOGO(league.leagueId)}" alt="${league.name}" onerror="this.style.display='none'" />
        <span class="ts-league-name">${league.name}</span>
        <span class="ts-league-count">${lc || ''}</span>
        <svg class="ts-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ts-teams">
        ${league.teams.map(team => {
          const cnt = getCount(team.name);
          const active = _activeTeam && _activeTeam.id === team.id;
          return `
          <div class="ts-team${active ? ' active' : ''}"
            onclick="selectTeam(${team.id},'${team.name.replace(/'/g,"\\'")}',${league.leagueId})">
            <img class="ts-team-logo" src="${LOGO(team.id)}" alt="${team.name}"
              onerror="this.replaceWith(makeFb('${team.name.replace(/'/g,"\\'")}'))" />
            <span class="ts-team-name">${team.name}</span>
            ${cnt ? `<span class="ts-team-cnt">${cnt}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function makeFb(name) {
  const d = document.createElement('div');
  d.className = 'ts-team-logo-fb';
  d.textContent = name.slice(0,2).toUpperCase();
  return d;
}
function toggleLeague(id) { document.getElementById('tl-league-' + id).classList.toggle('collapsed'); }

function selectTeam(id, name, leagueId) {
  if (_activeTeam && _activeTeam.id === id) { clearTeamFilter(); return; }
  _activeTeam = { id, name, leagueId };
  document.getElementById('tsReset').classList.add('visible');
  renderSidebar();
  renderList();
}

function clearTeamFilter() {
  _activeTeam = null;
  document.getElementById('tsReset').classList.remove('visible');
  renderSidebar();
  renderList();
}

/* ── 필터 바 ── */
function renderFilters() {
  document.getElementById('filters').innerHTML = FILTERS.map(f => `
    <div class="tf-chip${_filter === f.key ? ' active' : ''}" onclick="setFilter('${f.key}')">${f.label}</div>
  `).join('');
}
function setFilter(key) { _filter = key; renderFilters(); renderList(); }

/* ── 핫 스트립 ── */
function renderHotStrip() {
  const hot = _posts.filter(p => p.hot == 1);
  const strip = document.getElementById('hotStrip');
  if (!hot.length) { strip.style.display = 'none'; return; }
  strip.style.display = '';
  strip.innerHTML = `<span class="hot-strip-label">🔥 핫</span>` +
    hot.map(p => `
      <a class="hot-chip" href="/transfers/${p.id}">
        ${p.player}
        ${p.to_team ? `<span style="font-weight:400;opacity:.7;">→ ${p.to_team}</span>` : ''}
      </a>`).join('');
}

/* ── 핫 랭킹 사이드바 ── */
function renderHotRanking() {
  const hot   = _posts.filter(p => p.hot == 1).slice(0, 7);
  const items = hot.length ? hot : _posts.slice(0, 5);
  document.getElementById('hotRanking').innerHTML = items.length
    ? items.map((p, i) => `
        <a class="tls-hot-item" href="/transfers/${p.id}">
          <span class="tls-hot-rank${i < 3 ? ' top' : ''}">${i+1}</span>
          <div>
            <div class="tls-hot-name">${p.player}</div>
            ${p.from_team || p.to_team
              ? `<div class="tls-hot-route">${p.from_team||'?'} → ${p.to_team||'?'}</div>`
              : ''}
          </div>
          <span class="${(BADGE[p.badge]||BADGE.rumor).cls}" style="font-size:10px;padding:1px 6px;">${(BADGE[p.badge]||BADGE.rumor).label.replace(/👀|🔥|✅/g,'').trim()}</span>
        </a>`).join('')
    : '<div style="padding:20px 16px;font-size:13px;color:var(--ink-tertiary);">데이터 없음</div>';
}

/* ── 통계 ── */
function renderStats() {
  const t = _posts.length;
  const r = _posts.filter(p => p.badge === 'rumor').length;
  const o = _posts.filter(p => p.badge === 'official').length;
  const d = _posts.filter(p => p.badge === 'done').length;
  document.getElementById('statRows').innerHTML = [
    {label:'전체', val:t},{label:'루머', val:r},
    {label:'공식 발표', val:o},{label:'완료', val:d},
  ].map(x => `
    <div class="tls-stat-row">
      <span class="tls-stat-label">${x.label}</span>
      <span class="tls-stat-val">${x.val}</span>
    </div>`).join('');
}

/* ── 목록 렌더링 ── */
function renderList() {
  let filtered = _filter === 'all' ? [..._posts] : _posts.filter(p => p.badge === _filter);
  if (_activeTeam) filtered = filtered.filter(p => teamMatch(p, _activeTeam.name));

  const el = document.getElementById('postList');
  if (!filtered.length) {
    el.innerHTML = `
      <div class="post-list-empty">
        <div class="ple-icon">🏜️</div>
        <p>${_activeTeam ? `${_activeTeam.name} 관련 소식이 없습니다.` : '아직 이적 소식이 없습니다.'}</p>
      </div>`;
    document.getElementById('countBadge').innerHTML = '';
    return;
  }
  document.getElementById('countBadge').innerHTML = `<strong>${filtered.length}</strong>건의 이적 소식`;
  el.innerHTML = filtered.map(p => {
    const bm    = BADGE[p.badge] || BADGE.rumor;
    const fee   = p.fee && p.fee !== '-' ? p.fee : null;
    const ago   = timeAgo(p.updated_at);
    const fresh = isNew(p.updated_at);
    return `
      <a class="post-row" href="/transfers/${p.id}">
        <div class="pr-badge"><span class="${bm.cls}">${bm.label}</span></div>
        <div class="pr-info">
          <div class="pr-player">
            ${p.player}
            ${p.hot == 1 ? '<span class="pr-hot-badge">HOT</span>' : ''}
          </div>
          <div class="pr-route">
            <span>${p.from_team || '미정'}</span>
            <span class="pr-route-arrow">→</span>
            <span>${p.to_team || '미정'}</span>
          </div>
        </div>
        <div class="pr-fee${fee ? ' known' : ''}">${fee || '미공개'}</div>
        <div class="pr-time${fresh ? ' pr-updated' : ''}">${ago}</div>
      </a>`;
  }).join('');
}

/* ── 데이터 로드 (새 DB + 기존 content JSON 병합) ── */
async function load() {
  fetch('/api/track', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ page: '/transfers' }),
  }).catch(()=>{});

  const [tpRes, dataRes] = await Promise.allSettled([
    fetch('/api/transfer-posts'),
    fetch('/api/data'),
  ]);

  const newPosts = (tpRes.status === 'fulfilled' && tpRes.value.ok)
    ? await tpRes.value.json() : [];

  const oldData  = (dataRes.status === 'fulfilled' && dataRes.value.ok)
    ? await dataRes.value.json() : {};

  // 기존 transfers 배열을 새 포맷으로 변환
  const oldPosts = (oldData.transfers || []).map((t, i) => ({
    id:         'legacy_' + i + '_' + (t.player||'').replace(/\s/g,'_'),
    player:     t.player    || '선수 미상',
    from_team:  t.from      || '',
    to_team:    t.to        || '',
    fee:        t.fee       || '',
    badge:      t.badge     || 'rumor',
    detail:     t.detail    || '',
    source:     t.source    || '',
    hot:        0,
    created_at: t.date      || new Date().toISOString(),
    updated_at: t.date      || new Date().toISOString(),
    _legacy:    true,
  }));

  // 새 글 우선, 기존 글은 같은 선수가 없을 때만 추가
  const newPlayerKeys = new Set(newPosts.map(p => p.player.toLowerCase().trim()));
  const merged = [
    ...newPosts,
    ...oldPosts.filter(p => !newPlayerKeys.has(p.player.toLowerCase().trim())),
  ];
  _posts = merged;

  renderFilters();
  renderSidebar();
  renderHotStrip();
  renderHotRanking();
  renderStats();
  renderList();
}

load();
</script>
</body>
</html>
