<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-5886476101959679">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5886476101959679" crossorigin="anonymous"></script>
  <title>피드 — Kickoff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --bg2: #0d0f12;
      --bg3: #161a1f;
      --border: #1f2328;
      --border2: #262b32;
      --text: #e8eaed;
      --text2: #8b949e;
      --text3: #555e68;
      --accent: #5e6ad2;
      --accent2: #828fff;
      --fire: #ff6b00;
      --fire2: #ff9500;
      --ember: #fbbf24;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Nav ─── */
    .nav {
      position: sticky;
      top: 0;
      height: 56px;
      background: rgba(0,0,0,.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 100;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -.4px;
    }
    .nav-logo svg { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 2px;
      margin-left: 8px;
    }
    .nav-link {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      text-decoration: none;
      transition: background .12s, color .12s;
    }
    .nav-link:hover { background: var(--bg3); color: var(--text); }
    .nav-link.active { color: var(--text); background: var(--bg3); }
    .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-write {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .12s;
      font-family: inherit;
    }
    .btn-write:hover { background: var(--accent2); }

    /* ─── Layout ─── */
    .layout {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      align-items: start;
    }

    /* ─── Feed Column ─── */
    .feed-col {
      border-right: 1px solid var(--border);
      min-height: calc(100vh - 56px);
    }

    /* ─── Feed Header ─── */
    .feed-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .feed-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--text);
    }
    .feed-count {
      font-size: 12px;
      color: var(--text3);
    }

    /* ─── Filter Tabs ─── */
    .filter-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .ftab {
      flex-shrink: 0;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .12s, border-color .12s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
      white-space: nowrap;
    }
    .ftab:hover { color: var(--text); }
    .ftab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ─── Post Card ─── */
    .post-card {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
      position: relative;
    }
    .post-card:hover { background: rgba(255,255,255,.02); }

    .post-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .post-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .post-meta {
      flex: 1;
      min-width: 0;
    }
    .post-author-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .post-author {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .post-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(94,106,210,.2);
      color: var(--accent2);
      letter-spacing: .2px;
    }
    .post-badge.admin {
      background: rgba(251,191,36,.15);
      color: var(--ember);
    }
    .post-time {
      font-size: 12px;
      color: var(--text3);
    }

    /* Category chip */
    .post-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .cat-이적 { background: rgba(255,107,0,.12); color: var(--fire); border: 1px solid rgba(255,107,0,.2); }
    .cat-경기 { background: rgba(74,222,128,.1); color: #4ade80; border: 1px solid rgba(74,222,128,.2); }
    .cat-루머 { background: rgba(251,191,36,.1); color: var(--ember); border: 1px solid rgba(251,191,36,.2); }
    .cat-분석 { background: rgba(94,106,210,.12); color: var(--accent2); border: 1px solid rgba(94,106,210,.2); }
    .cat-뉴스 { background: rgba(56,189,248,.1); color: #38bdf8; border: 1px solid rgba(56,189,248,.2); }
    .cat-잡담 { background: rgba(255,255,255,.06); color: var(--text2); border: 1px solid rgba(255,255,255,.08); }

    /* Post Title */
    .post-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
      letter-spacing: -.2px;
    }

    /* Post Content */
    .post-content {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.65;
      word-break: break-word;
    }
    .post-content.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Rich text formatting inside posts */
    .post-content b, .post-content strong { font-weight: 700; color: var(--text); }
    .post-content i, .post-content em { font-style: italic; }
    .post-content u { text-decoration: underline; }
    .post-content s, .post-content del { text-decoration: line-through; }
    .post-content a { color: var(--accent2); text-decoration: underline; }
    .post-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 12px;
      background: rgba(94,106,210,.06);
      border-radius: 0 4px 4px 0;
      margin: 6px 0;
      color: var(--text2);
    }
    .post-content img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
    .post-content h1 { font-size: 20px; font-weight: 800; margin: 8px 0 4px; color: var(--text); }
    .post-content h2 { font-size: 16px; font-weight: 700; margin: 6px 0 3px; color: var(--text); }
    .post-content h3 { font-size: 14px; font-weight: 600; margin: 4px 0 2px; color: var(--text); }
    .post-content ul, .post-content ol { padding-left: 20px; }
    .post-content li { margin: 2px 0; }
    .post-content code {
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: monospace;
      color: #f87171;
    }
    .post-content hr { border: none; border-top: 1px solid var(--border2); margin: 8px 0; }

    /* Image */
    .post-img {
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border2);
    }
    .post-img img {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: cover;
      display: block;
    }

    /* Actions */
    .post-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 12px;
    }
    .act-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 0;
      border-radius: 4px;
      transition: color .12s;
    }
    .act-btn:hover { color: var(--text2); }
    .act-btn.liked { color: #ef4444; }
    .act-btn.liked svg { fill: #ef4444; stroke: #ef4444; }
    .act-btn svg { transition: transform .1s; }
    .act-btn:active svg { transform: scale(1.2); }

    /* ─── Expand button ─── */
    .expand-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--accent2);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 0;
      margin-top: 4px;
    }
    .expand-btn:hover { text-decoration: underline; }

    /* ─── Delete button (admin) ─── */
    .delete-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .12s, background .12s, color .12s;
    }
    .post-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: rgba(239,68,68,.12); color: #ef4444; }

    /* ─── Sidebar ─── */
    .sidebar {
      padding: 20px 16px;
      position: sticky;
      top: 56px;
    }

    .sidebar-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -.2px;
    }

    /* Hot topics */
    .hot-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .hot-item:last-child { border-bottom: none; }
    .hot-num {
      font-size: 18px;
      font-weight: 900;
      color: var(--border2);
      line-height: 1;
      min-width: 18px;
    }
    .hot-item:nth-child(-n+3) .hot-num { color: var(--fire); }
    .hot-info { flex: 1; }
    .hot-cat { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
    .hot-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Write CTA */
    .write-cta {
      text-align: center;
    }
    .write-cta p {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .write-cta a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background .12s;
    }
    .write-cta a:hover { background: var(--accent2); }

    /* ─── Empty state ─── */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .empty-desc {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.6;
    }

    /* ─── Loading skeleton ─── */
    .skeleton-card {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .skel {
      background: var(--bg3);
      border-radius: 4px;
      animation: skelPulse 1.4s ease-in-out infinite;
    }
    @keyframes skelPulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
    .skel-avatar { width: 38px; height: 38px; border-radius: 50%; }
    .skel-line { height: 12px; margin-bottom: 8px; }
    .skel-row { display: flex; gap: 10px; margin-bottom: 10px; }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text);
      z-index: 9999;
      transition: transform .2s ease;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Post Detail Overlay ─── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      overflow-y: auto;
    }
    .overlay.open { display: flex; }
    .detail-modal {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      padding: 0;
      position: relative;
    }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .detail-header-title {
      font-size: 15px;
      font-weight: 700;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .1s;
    }
    .close-btn:hover { background: var(--bg3); color: var(--text); }
    .detail-body {
      padding: 20px;
    }
    .detail-author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .detail-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .detail-author { font-size: 15px; font-weight: 700; }
    .detail-time { font-size: 12px; color: var(--text3); }
    .detail-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--text);
    }
    .detail-content {
      font-size: 15px;
      color: var(--text2);
      line-height: 1.7;
      word-break: break-word;
    }
    .detail-content b, .detail-content strong { font-weight: 700; color: var(--text); }
    .detail-content i, .detail-content em { font-style: italic; }
    .detail-content u { text-decoration: underline; }
    .detail-content s { text-decoration: line-through; }
    .detail-content a { color: var(--accent2); text-decoration: underline; }
    .detail-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 14px;
      background: rgba(94,106,210,.06);
      border-radius: 0 4px 4px 0;
      margin: 8px 0;
    }
    .detail-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
    .detail-content h1 { font-size: 22px; font-weight: 800; margin: 12px 0 6px; color: var(--text); }
    .detail-content h2 { font-size: 18px; font-weight: 700; margin: 10px 0 4px; color: var(--text); }
    .detail-content h3 { font-size: 15px; font-weight: 600; margin: 8px 0 3px; color: var(--text); }
    .detail-content ul, .detail-content ol { padding-left: 22px; }
    .detail-content li { margin: 3px 0; }
    .detail-content code {
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 13px;
      font-family: monospace;
      color: #f87171;
    }
    .detail-content hr { border: none; border-top: 1px solid var(--border2); margin: 12px 0; }
    .detail-img {
      margin-top: 16px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border2);
    }
    .detail-img img { width: 100%; height: auto; display: block; }
    .detail-footer {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .feed-col { border-right: none; }
    }
    @media (max-width: 480px) {
      .nav-links { display: none; }
      .post-card { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- ─── Nav ─── -->
<nav class="nav">
  <a href="/kickoff/transfers" class="nav-logo">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
      <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
    </svg>
    Kickoff
  </a>
  <div class="nav-links">
    <a href="/kickoff/transfers" class="nav-link">🔥 이적시장</a>
    <a href="/kickoff/feed" class="nav-link active">📣 피드</a>
  </div>
  <div class="nav-right">
    <a href="/kickoff/write" class="btn-write" id="writeBtn">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 11.5V14h2.5l7.37-7.37-2.5-2.5L2 11.5zM13.71 4.29a1 1 0 0 0 0-1.41l-1.09-1.09a1 1 0 0 0-1.41 0L10 3l2.5 2.5 1.21-1.21z" fill="currentColor"/></svg>
      글쓰기
    </a>
  </div>
</nav>

<!-- ─── Layout ─── -->
<div class="layout">

  <!-- ─── Feed ─── -->
  <main class="feed-col">
    <div class="feed-header">
      <span class="feed-title">📣 피드</span>
      <span class="feed-count" id="feedCount"></span>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="ftab active" data-cat="all">전체</button>
      <button class="ftab" data-cat="이적">⚡ 이적</button>
      <button class="ftab" data-cat="경기">⚽ 경기</button>
      <button class="ftab" data-cat="루머">👀 루머</button>
      <button class="ftab" data-cat="분석">📊 분석</button>
      <button class="ftab" data-cat="뉴스">📰 뉴스</button>
      <button class="ftab" data-cat="잡담">💬 잡담</button>
    </div>

    <!-- Post List -->
    <div id="postList">
      <!-- skeleton -->
      <div class="skeleton-card">
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div style="flex:1">
            <div class="skel skel-line" style="width:120px"></div>
            <div class="skel skel-line" style="width:200px"></div>
            <div class="skel skel-line" style="width:80%"></div>
          </div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skel-row">
          <div class="skel skel-avatar"></div>
          <div style="flex:1">
            <div class="skel skel-line" style="width:100px"></div>
            <div class="skel skel-line" style="width:160px"></div>
            <div class="skel skel-line" style="width:70%"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ─── Sidebar ─── -->
  <aside class="sidebar">
    <!-- Write CTA -->
    <div class="sidebar-card write-cta" id="writeCta">
      <p>경기 분석, 이적 루머, 뉴스를<br>직접 공유해보세요</p>
      <a href="/kickoff/write">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 11.5V14h2.5l7.37-7.37-2.5-2.5L2 11.5zM13.71 4.29a1 1 0 0 0 0-1.41l-1.09-1.09a1 1 0 0 0-1.41 0L10 3l2.5 2.5 1.21-1.21z" fill="currentColor"/></svg>
        글 작성하기
      </a>
    </div>

    <!-- Hot Topics -->
    <div class="sidebar-card">
      <div class="sidebar-title">🔥 인기 게시물</div>
      <div id="hotList">
        <div style="font-size:13px;color:var(--text3);padding:8px 0">게시물을 불러오는 중...</div>
      </div>
    </div>

    <!-- Categories -->
    <div class="sidebar-card">
      <div class="sidebar-title">카테고리</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="catStats"></div>
    </div>
  </aside>

</div>

<!-- ─── Post Detail Overlay ─── -->
<div class="overlay" id="detailOverlay">
  <div class="detail-modal" id="detailModal">
    <div class="detail-header">
      <span class="detail-header-title">게시물</span>
      <button class="close-btn" id="detailClose">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-footer" id="detailFooter"></div>
  </div>
</div>

<!-- ─── Toast ─── -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   State
══════════════════════════════════════════ */
let allPosts = [];
let currentCat = 'all';
let currentUser = null;
let likedSet = new Set(JSON.parse(localStorage.getItem('kf_liked') || '[]'));

/* ══════════════════════════════════════════
   Init
══════════════════════════════════════════ */
(async () => {
  await checkAuth();
  await loadPosts();
})();

/* ─── Auth check ─── */
async function checkAuth() {
  try {
    const r = await fetch('/api/auth/me');
    if (r.ok) {
      currentUser = await r.json();
    }
  } catch(_) {}

  if (!currentUser) {
    // Show login hint on write button
    document.getElementById('writeBtn').href = '/kickoff/login';
  }
}

/* ─── Load posts ─── */
async function loadPosts() {
  try {
    const r = await fetch('/api/posts');
    if (!r.ok) throw new Error('failed');
    allPosts = await r.json();
    renderPosts();
    renderSidebar();
  } catch(e) {
    document.getElementById('postList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">😵</div>
        <div class="empty-title">불러오기 실패</div>
        <div class="empty-desc">잠시 후 다시 시도해주세요</div>
      </div>
    `;
  }
}

/* ══════════════════════════════════════════
   Render
══════════════════════════════════════════ */
function renderPosts() {
  const filtered = currentCat === 'all'
    ? allPosts
    : allPosts.filter(p => p.category && p.category.includes(currentCat));

  document.getElementById('feedCount').textContent =
    filtered.length ? `${filtered.length}개` : '';

  if (!filtered.length) {
    document.getElementById('postList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗒️</div>
        <div class="empty-title">아직 게시물이 없어요</div>
        <div class="empty-desc">첫 번째 글을 작성해보세요!</div>
      </div>
    `;
    return;
  }

  document.getElementById('postList').innerHTML = filtered.map(p => renderCard(p)).join('');

  // Bind events
  filtered.forEach(p => {
    const card = document.querySelector(`[data-id="${p.id}"]`);
    if (!card) return;
    card.addEventListener('click', e => {
      if (e.target.closest('.act-btn') || e.target.closest('.delete-btn')) return;
      openDetail(p);
    });
    const likeBtn = card.querySelector('.like-btn');
    if (likeBtn) likeBtn.addEventListener('click', () => likePost(p.id, likeBtn));
    const delBtn = card.querySelector('.delete-btn');
    if (delBtn) delBtn.addEventListener('click', () => deletePost(p.id, card));
    const expandBtn = card.querySelector('.expand-btn');
    if (expandBtn) expandBtn.addEventListener('click', e => {
      e.stopPropagation();
      const contentEl = card.querySelector('.post-content');
      contentEl.classList.remove('clamped');
      expandBtn.remove();
    });
  });
}

function renderCard(p) {
  const isLiked = likedSet.has(p.id);
  const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'editor');
  const initials = (p.author || 'A').slice(0, 2).toUpperCase();
  const catKey = getCatKey(p.category);
  const catIcon = getCatIcon(p.category);
  const timeStr = formatTime(p.created_at);
  // Strip HTML tags to get plain text length for clamp decision
  const plainText = p.content ? p.content.replace(/<[^>]*>/g, '') : '';
  const longContent = plainText.length > 280;

  return `
    <div class="post-card" data-id="${p.id}">
      ${isAdmin ? `
        <button class="delete-btn" title="삭제">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6 4V2h4v2M6 7v5M10 7v5M3 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      ` : ''}
      <div class="post-header">
        <div class="post-avatar">${initials}</div>
        <div class="post-meta">
          <div class="post-author-row">
            <span class="post-author">${escHtml(p.author)}</span>
            ${p.author === 'admin' ? '<span class="post-badge admin">ADMIN</span>' : '<span class="post-badge">에디터</span>'}
          </div>
          <span class="post-time">${timeStr}</span>
        </div>
      </div>
      <span class="post-cat cat-${catKey}">${catIcon} ${p.category}</span>
      ${p.title ? `<div class="post-title">${escHtml(p.title)}</div>` : ''}
      <div class="post-content${longContent ? ' clamped' : ''}">${p.content || ''}</div>
      ${longContent ? `<button class="expand-btn">더 보기 <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>` : ''}
      ${p.image_url ? `<div class="post-img"><img src="${escHtml(p.image_url)}" alt="" loading="lazy" onerror="this.parentElement.remove()"/></div>` : ''}
      <div class="post-actions">
        <button class="act-btn like-btn${isLiked ? ' liked' : ''}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 13.5C8 13.5 1.5 9.5 1.5 5.5a3 3 0 015.5-1.6A3 3 0 0114.5 5.5c0 4-6.5 8-6.5 8z"/>
          </svg>
          <span class="like-count">${p.likes || 0}</span>
        </button>
        <button class="act-btn share-btn" onclick="sharePost(event,'${p.id}')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M12 2l-4 4m4-4H8m4 0v4M7 9l-4 4m0 0h4m-4 0v-4"/>
          </svg>
          공유
        </button>
      </div>
    </div>
  `;
}

function renderSidebar() {
  // Hot posts (top 5 by likes)
  const hot = [...allPosts].sort((a,b) => (b.likes||0)-(a.likes||0)).slice(0,5);
  if (hot.length) {
    document.getElementById('hotList').innerHTML = hot.map((p,i) => `
      <div class="hot-item" onclick="openDetail(allPosts.find(x=>x.id==='${p.id}'))">
        <span class="hot-num">${i+1}</span>
        <div class="hot-info">
          <div class="hot-cat">${getCatIcon(p.category)} ${p.category}</div>
          <div class="hot-text">${escHtml(p.title || p.content)}</div>
        </div>
      </div>
    `).join('');
  } else {
    document.getElementById('hotList').innerHTML =
      '<div style="font-size:13px;color:var(--text3);padding:8px 0">아직 게시물이 없어요</div>';
  }

  // Cat stats
  const catMap = {};
  allPosts.forEach(p => {
    const key = getCatKey(p.category);
    catMap[key] = (catMap[key]||0)+1;
  });
  const catData = [
    { key:'이적', icon:'⚡', cls:'cat-이적' },
    { key:'경기', icon:'⚽', cls:'cat-경기' },
    { key:'루머', icon:'👀', cls:'cat-루머' },
    { key:'분석', icon:'📊', cls:'cat-분석' },
    { key:'뉴스', icon:'📰', cls:'cat-뉴스' },
    { key:'잡담', icon:'💬', cls:'cat-잡담' },
  ];
  document.getElementById('catStats').innerHTML = catData.map(c => `
    <button onclick="setFilter('${c.key}')" style="background:none;border:none;cursor:pointer;padding:0;">
      <span class="post-cat ${c.cls}" style="cursor:pointer;font-size:12px">
        ${c.icon} ${c.key} ${catMap[c.key]||0}
      </span>
    </button>
  `).join('');
}

/* ══════════════════════════════════════════
   Filter
══════════════════════════════════════════ */
document.querySelectorAll('.ftab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setFilter(btn.dataset.cat);
  });
});

function setFilter(cat) {
  currentCat = cat;
  // sync tabs
  document.querySelectorAll('.ftab').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  renderPosts();
}

/* ══════════════════════════════════════════
   Like
══════════════════════════════════════════ */
async function likePost(id, btn) {
  if (likedSet.has(id)) { showToast('이미 좋아요 했어요'); return; }
  likedSet.add(id);
  localStorage.setItem('kf_liked', JSON.stringify([...likedSet]));

  // Optimistic
  const post = allPosts.find(p=>p.id===id);
  if (post) post.likes = (post.likes||0)+1;
  btn.classList.add('liked');
  btn.querySelector('.like-count').textContent = post ? post.likes : '?';
  btn.querySelector('svg').setAttribute('fill','currentColor');

  try {
    await fetch(`/api/posts/${id}/like`, { method:'POST' });
  } catch(_) {}
}

/* ══════════════════════════════════════════
   Delete
══════════════════════════════════════════ */
async function deletePost(id, card) {
  if (!confirm('게시물을 삭제하시겠어요?')) return;
  try {
    const r = await fetch(`/api/posts/${id}`, { method:'DELETE' });
    if (r.ok) {
      allPosts = allPosts.filter(p=>p.id!==id);
      card.style.opacity = '0';
      card.style.height = card.offsetHeight+'px';
      card.style.overflow = 'hidden';
      card.style.transition = 'all .2s';
      setTimeout(() => { card.style.height = '0'; card.style.padding = '0'; }, 50);
      setTimeout(() => { card.remove(); renderSidebar(); }, 300);
      showToast('삭제되었어요');
    } else {
      const d = await r.json().catch(()=>({}));
      showToast(d.error || '삭제 권한이 없어요');
    }
  } catch(_) {
    showToast('오류가 발생했어요');
  }
}

/* ══════════════════════════════════════════
   Share
══════════════════════════════════════════ */
function sharePost(e, id) {
  e.stopPropagation();
  const post = allPosts.find(p=>p.id===id);
  const text = post ? `[Kickoff] ${post.title || post.content.slice(0,50)}` : 'Kickoff 게시물';
  if (navigator.share) {
    navigator.share({ title: text, url: location.href }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(location.href).then(() => showToast('링크 복사됨'));
  }
}

/* ══════════════════════════════════════════
   Detail Modal
══════════════════════════════════════════ */
function openDetail(p) {
  if (!p) return;
  const isLiked = likedSet.has(p.id);
  const catKey = getCatKey(p.category);
  const catIcon = getCatIcon(p.category);
  const initials = (p.author||'A').slice(0,2).toUpperCase();

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-author-row">
      <div class="detail-avatar">${initials}</div>
      <div>
        <div class="detail-author">${escHtml(p.author)}</div>
        <div class="detail-time">${formatTime(p.created_at)}</div>
      </div>
      <span class="post-cat cat-${catKey}" style="margin-left:auto">${catIcon} ${p.category}</span>
    </div>
    ${p.title ? `<div class="detail-title">${escHtml(p.title)}</div>` : ''}
    <div class="detail-content">${p.content || ''}</div>
    ${p.image_url ? `<div class="detail-img"><img src="${escHtml(p.image_url)}" alt="" onerror="this.parentElement.remove()"/></div>` : ''}
  `;

  document.getElementById('detailFooter').innerHTML = `
    <button class="act-btn like-btn${isLiked?' liked':''}" onclick="likeFromDetail('${p.id}', this)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="${isLiked?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13.5C8 13.5 1.5 9.5 1.5 5.5a3 3 0 015.5-1.6A3 3 0 0114.5 5.5c0 4-6.5 8-6.5 8z"/>
      </svg>
      <span class="like-count">${p.likes||0}</span>
    </button>
    <span style="font-size:13px;color:var(--text3);margin-left:auto">${formatTime(p.created_at)}</span>
  `;

  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function likeFromDetail(id, btn) {
  const card = document.querySelector(`[data-id="${id}"] .like-btn`);
  likePost(id, btn);
  if (card) likePost(id, card);
}

document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ══════════════════════════════════════════
   Helpers
══════════════════════════════════════════ */
function getCatKey(cat) {
  if (!cat) return '잡담';
  if (cat.includes('이적')) return '이적';
  if (cat.includes('경기')) return '경기';
  if (cat.includes('루머')) return '루머';
  if (cat.includes('분석')) return '분석';
  if (cat.includes('뉴스')) return '뉴스';
  return '잡담';
}
function getCatIcon(cat) {
  if (!cat) return '💬';
  if (cat.includes('이적')) return '⚡';
  if (cat.includes('경기')) return '⚽';
  if (cat.includes('루머')) return '👀';
  if (cat.includes('분석')) return '📊';
  if (cat.includes('뉴스')) return '📰';
  return '💬';
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 604800) return Math.floor(diff/86400) + '일 전';
  return d.toLocaleDateString('ko-KR', { month:'short', day:'numeric' });
}
function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
