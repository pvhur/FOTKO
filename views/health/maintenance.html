<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업데이트 중 — Kickoff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #010102;
      color: #f7f8f8;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* 배경 그라디언트 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 100%, rgba(94,106,210,.1) 0%, transparent 70%),
        radial-gradient(ellipse 30% 30% at 20% 20%, rgba(94,106,210,.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 상단 네브 */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(1,1,2,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #23252a;
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 100;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: #f7f8f8;
      text-decoration: none;
    }
    .nav-logo svg { color: #5e6ad2; }

    /* 메인 컨텐츠 */
    .container {
      text-align: center;
      padding: 24px;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    /* 아이콘 */
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(94,106,210,.12);
      border: 1px solid rgba(94,106,210,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 배지 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(94,106,210,.12);
      border: 1px solid rgba(94,106,210,.2);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #828fff;
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #5e6ad2;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    /* 타이틀 */
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      color: #f7f8f8;
      margin-bottom: 16px;
    }
    h1 span {
      background: linear-gradient(135deg, #828fff, #5e6ad2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 15px;
      color: #8a8f98;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    /* 버튼 */
    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all .14s;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: #5e6ad2;
      color: #fff;
    }
    .btn-primary:hover { background: #828fff; }
    .btn-secondary {
      background: #0d0e11;
      color: #d0d6e0;
      border: 1px solid #23252a;
    }
    .btn-secondary:hover { background: #16181d; border-color: #2e3039; }

    /* 진행 상황 */
    .progress-wrap {
      margin: 40px 0 0;
      padding: 20px 24px;
      background: #0d0e11;
      border: 1px solid #23252a;
      border-radius: 12px;
      text-align: left;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #62666d;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 4px;
      background: #16181d;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5e6ad2, #828fff);
      border-radius: 2px;
      animation: progressAnim 2.5s ease-in-out infinite alternate;
    }
    @keyframes progressAnim {
      from { width: 55%; }
      to   { width: 80%; }
    }
    .progress-items {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #8a8f98;
    }
    .pi-done { color: #4ade80; }
    .pi-wip  { color: #fbbf24; }
    .pi-todo { color: #62666d; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/kickoff/transfers" class="nav-logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
    </svg>
    Kickoff
  </a>
</nav>

<div class="container">
  <div class="icon-wrap">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5e6ad2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  </div>

  <div class="badge">
    <div class="badge-dot"></div>
    업데이트 진행 중
  </div>

  <h1>지금 <span>새단장</span> 중이에요</h1>
  <p>더 나은 경험을 위해 페이지를 개선하고 있어요.<br>이적시장 페이지는 지금 바로 이용 가능해요.</p>

  <div class="btn-group">
    <a href="/kickoff/transfers" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M3 10h14M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      이적시장 보기 🔥
    </a>
    <a href="javascript:history.back()" class="btn btn-secondary">뒤로 가기</a>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>전체 업데이트 진행률</span>
      <span id="pct">--</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="pFill"></div>
    </div>
    <div class="progress-items">
      <div class="progress-item pi-done">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/><path d="M5 8l2.5 2.5L11 5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        이적 시장 페이지 완료
      </div>
      <div class="progress-item pi-wip">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v3.5l2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        홈 · 리그 · 경기 결과 업데이트 중
      </div>
      <div class="progress-item pi-todo">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/></svg>
        분석 페이지 준비 중
      </div>
    </div>
  </div>
</div>

<script>
  // 진행률 애니메이션
  const fill = document.getElementById('pFill');
  const pct  = document.getElementById('pct');
  let v = 55;
  setInterval(() => {
    v = 55 + Math.sin(Date.now() / 1500) * 12;
    pct.textContent = Math.round(v) + '%';
  }, 100);
</script>
</body>
</html>
