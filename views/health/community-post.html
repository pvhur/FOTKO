<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 — Kickoff 커뮤니티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/kickoff.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5886476101959679" crossorigin="anonymous"></script>
  <style>
    .cm-wrap { max-width:760px; margin:0 auto; padding:calc(56px + 40px) 32px 80px; }
    .pv-cat { font-size:12px; font-weight:600; color:var(--primary-hover); }
    .pv-title { font-size:clamp(22px,3vw,30px); font-weight:700; letter-spacing:-.6px; margin:8px 0 12px; }
    .pv-meta { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-tertiary); padding-bottom:20px; border-bottom:1px solid var(--hairline); margin-bottom:24px; }
    .pv-body { font-size:16px; line-height:1.85; color:var(--ink-muted); white-space:pre-wrap; word-break:keep-all; margin-bottom:32px; }
    .pv-del { margin-left:auto; font-size:12px; color:#f87171; background:none; border:none; cursor:pointer; }
    /* 댓글 */
    .cm-sec h3 { font-size:15px; font-weight:600; margin-bottom:14px; }
    .cm-list { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
    .cm-item { display:flex; gap:10px; padding:12px 14px; background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-md); }
    .cm-avatar { width:30px; height:30px; border-radius:50%; background:rgba(34,197,94,.2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--primary-hover); flex-shrink:0; }
    .cm-cbody { flex:1; min-width:0; }
    .cm-cmeta { font-size:12px; color:var(--ink-tertiary); margin-bottom:3px; display:flex; align-items:center; gap:8px; }
    .cm-cmeta b { color:var(--ink); font-weight:600; }
    .cm-ctext { font-size:14px; color:var(--ink-muted); line-height:1.6; white-space:pre-wrap; word-break:break-word; }
    .cm-cdel { font-size:11px; color:var(--ink-tertiary); background:none; border:none; cursor:pointer; margin-left:auto; }
    .cm-form { display:flex; gap:8px; }
    .cm-form textarea { flex:1; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); padding:10px 12px; color:var(--ink); font-size:14px; font-family:inherit; outline:none; resize:none; min-height:44px; }
    .cm-login-hint { font-size:13px; color:var(--ink-subtle); }
    @media(max-width:768px){ .cm-wrap{ padding:calc(56px+24px) 16px 56px; } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a href="/kickoff" class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
      </svg>
      Kickoff
    </a>
    <ul class="nav-links">
      <li><a href="/kickoff">홈</a></li>
      <li><a href="/kickoff/transfers">이적 시장 🔥</a></li>
      <li><a href="/kickoff/community" class="active">커뮤니티</a></li>
    </ul>
    <div class="nav-right">
      <a href="/kickoff/login" class="btn btn-secondary btn-sm" id="nav-login-btn">로그인</a>
      <a href="#" class="btn btn-primary btn-sm">구독하기</a>
    </div>
  </div>
</nav>

<main class="cm-wrap">
  <a href="/kickoff/community" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-subtle);margin-bottom:20px;">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 7H3M6 4L3 7l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    목록으로
  </a>

  <article id="postView"><div style="color:var(--ink-tertiary);padding:40px 0;text-align:center;">불러오는 중…</div></article>

  <section class="cm-sec" id="commentSec" style="display:none;margin-top:36px;">
    <h3>댓글 <span id="cmCount">0</span></h3>
    <div class="cm-list" id="commentList"></div>
    <div id="commentFormWrap"></div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;">
      <p>© 2026 Kickoff. All rights reserved.</p>
      <div class="footer-links"><a href="/kickoff/privacy">개인정보처리방침</a><a href="/kickoff/terms">이용약관</a></div>
    </div>
  </div>
</footer>

<script>
const POST_ID = location.pathname.split('/').pop();
const CAT_LABEL = { free:'자유게시판', cheer:'응원톡', talk:'이적 토론' };
let _me = null;

function esc(s){ return (s||'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmt(iso){ if(!iso)return''; const d=new Date(iso); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

async function init() {
  try { const r = await fetch('/api/auth/me',{credentials:'include'}); if (r.ok) _me = await r.json(); } catch {}
  await loadPost();
  await loadComments();
  renderCommentForm();
}

async function loadPost() {
  try {
    const p = await fetch('/api/posts/' + POST_ID).then(r => r.ok ? r.json() : null);
    if (!p) { document.getElementById('postView').innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--ink-tertiary);">삭제되었거나 없는 글입니다.</div>'; return; }
    const canDel = _me && (_me.id === p.user_id || _me.role === 'admin');
    document.getElementById('postView').innerHTML = `
      <div class="pv-cat">${CAT_LABEL[p.category]||'자유게시판'}</div>
      <h1 class="pv-title">${esc(p.title)}</h1>
      <div class="pv-meta">
        <span><b style="color:var(--ink);">${esc(p.username)}</b></span>
        <span>·</span><span>${fmt(p.created_at)}</span>
        <span>·</span><span>조회 ${p.views||0}</span>
        ${canDel ? `<button class="pv-del" onclick="delPost()">삭제</button>` : ''}
      </div>
      <div class="pv-body">${esc(p.body)}</div>`;
    document.getElementById('commentSec').style.display = 'block';
  } catch { document.getElementById('postView').innerHTML = '<div style="padding:40px 0;text-align:center;color:#f87171;">불러오기 실패</div>'; }
}

async function delPost() {
  if (!confirm('이 글을 삭제할까요?')) return;
  const r = await fetch('/api/posts/' + POST_ID, { method:'DELETE', credentials:'include' });
  if (r.ok) location.href = '/kickoff/community';
  else alert('삭제 실패');
}

async function loadComments() {
  const list = document.getElementById('commentList');
  try {
    const rows = await fetch('/api/comments?key=post:' + POST_ID).then(r => r.json());
    document.getElementById('cmCount').textContent = rows.length;
    if (!rows.length) { list.innerHTML = '<div style="color:var(--ink-tertiary);font-size:13px;padding:8px 0;">첫 댓글을 남겨보세요.</div>'; return; }
    list.innerHTML = rows.map(c => {
      const canDel = _me && (_me.id === c.user_id || _me.role === 'admin');
      return `
      <div class="cm-item">
        <div class="cm-avatar">${(c.username||'?')[0].toUpperCase()}</div>
        <div class="cm-cbody">
          <div class="cm-cmeta"><b>${esc(c.username)}</b><span>${fmt(c.created_at)}</span>${canDel?`<button class="cm-cdel" onclick="delComment('${c.id}')">삭제</button>`:''}</div>
          <div class="cm-ctext">${esc(c.body)}</div>
        </div>
      </div>`;
    }).join('');
  } catch { list.innerHTML = '<div style="color:#f87171;font-size:13px;">댓글 불러오기 실패</div>'; }
}

function renderCommentForm() {
  const wrap = document.getElementById('commentFormWrap');
  if (!_me) {
    wrap.innerHTML = `<div class="cm-login-hint">댓글을 쓰려면 <a href="/kickoff/login?redirect=/kickoff/community/${POST_ID}" style="color:var(--primary-hover);">로그인</a>하세요.</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="cm-form">
      <textarea id="cmInput" maxlength="500" placeholder="댓글을 입력하세요"></textarea>
      <button class="btn btn-primary btn-sm" onclick="submitComment()">등록</button>
    </div>`;
}

async function submitComment() {
  const inp = document.getElementById('cmInput');
  const body = inp.value.trim();
  if (!body) return;
  inp.disabled = true;
  try {
    const r = await fetch('/api/comments', {
      method:'POST', credentials:'include',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ key: 'post:' + POST_ID, body }),
    });
    if (!r.ok) { alert('댓글 등록 실패'); return; }
    inp.value = '';
    await loadComments();
  } catch { alert('서버 오류'); }
  finally { inp.disabled = false; }
}

async function delComment(id) {
  if (!confirm('댓글을 삭제할까요?')) return;
  const r = await fetch('/api/comments/' + id, { method:'DELETE', credentials:'include' });
  if (r.ok) await loadComments();
  else alert('삭제 실패');
}

init();
</script>
<script src="/js/kickoff-nav.js"></script>
</body>
</html>
