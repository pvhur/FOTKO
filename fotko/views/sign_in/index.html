<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/sign_in/style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   
   input {
       width: 100%;
       height: 100%;
       padding: 15px 18px;
       font-family: "MPlus2-Regular", sans-serif;
       font-size: 16px;
       color: #fff;
   }

   input::placeholder {
       color: #808080;
   }

   .rectangle-3 {
       cursor: pointer;
   }

   .error-message {
       color: #ff5053;
       font-family: "MPlus2-Regular", sans-serif;
       font-size: 14px;
       margin-bottom: 10px;
       display: none;
   }
   
   .input-container {
       margin-bottom: 20px;
   }
   
   .sign-up-container {
       display: flex;
       flex-direction: row;
       align-items: center;
       justify-content: center;
       gap: 10px;
   }
   
   .sign-up a {
       color: #feffc9;
       font-family: "Livvic-MediumItalic", sans-serif;
       font-size: 25px;
       font-weight: 500;
       font-style: italic;
       text-decoration: underline;
   }
   </style>
  <title>로그인</title>
</head>
<body>
  <div class="login">
    <div class="group-1">
      <div class="ellipse-2"></div>
      <div class="ellipse-3"></div>
    </div>
    <div class="group-5">
      <div class="login2">LOGIN</div>
      <div class="input-container">
        <div class="rectangle-1">
          <input type="text" placeholder="Username" id="username">
        </div>
      </div>
      <div class="input-container">
        <div class="rectangle-2">
          <input type="password" placeholder="Password" id="password">
        </div>
      </div>
      <div class="error-message" id="errorMessage">로그인 정보를 입력해주세요</div>
      <div class="rectangle-3" onclick="validateLogin()">
        <div class="login3">LOGIN</div>
      </div>
      <div class="sign-up-container">
        <div class="don-t-you-have-any-acount">don't you have any acount?</div>
        <div class="sign-up"><a href="/signup">Sign Up</a></div>
      </div>
    </div>
  </div>
  
  <script src="/js/config.js"></script>
  <script src="/js/sign_in/login.js"></script>
</body>
</html>
