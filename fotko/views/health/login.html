<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27><path d=%27M10 2L17.32 6V14L10 18L2.68 14V6Z%27 stroke=%27%235e6ad2%27 stroke-width=%271.5%27 fill=%27none%27/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — Kickoff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/kickoff.css" />
  <style>
    body { min-height:100vh; display:flex; flex-direction:column; }

    /* ── 상단 바 ── */
    .top-bar { height:56px; background:rgba(1,1,2,.88); backdrop-filter:blur(14px); border-bottom:1px solid var(--hairline); display:flex; align-items:center; flex-shrink:0; }
    .top-bar-inner { display:flex; align-items:center; justify-content:space-between; width:100%; }

    /* ── 중앙 인증 영역 ── */
    .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 16px; }
    .auth-card { background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--r-xl); padding:40px; width:100%; max-width:400px; position:relative; overflow:hidden; }
    .auth-card::before { content:''; position:absolute; inset:0 0 auto; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent); pointer-events:none; }

    .auth-logo { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; letter-spacing:-.3px; margin-bottom:28px; color:var(--ink); }
    .auth-logo svg { color:var(--primary); }
    .auth-title { font-size:22px; font-weight:700; letter-spacing:-.5px; margin-bottom:6px; }
    .auth-sub   { font-size:13px; color:var(--ink-subtle); margin-bottom:24px; line-height:1.5; }

    /* ── 구글 버튼 ── */
    .btn-google {
      width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
      padding:10px 16px; border-radius:var(--r-md); font-size:14px; font-weight:500;
      background:#fff; color:#3c4043; border:1px solid #dadce0; cursor:pointer;
      font-family:inherit; transition:background .14s, box-shadow .14s;
    }
    .btn-google:hover { background:#f8f9fa; box-shadow:0 1px 4px rgba(0,0,0,.18); }
    .btn-google:active { background:#e8eaed; }

    /* ── 구분선 ── */
    .auth-divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
    .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--hairline); }
    .auth-divider span { font-size:11px; color:var(--ink-tertiary); white-space:nowrap; letter-spacing:.5px; }

    /* ── 필드 ── */
    .auth-fields { display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:11px; font-weight:600; color:var(--ink-subtle); letter-spacing:.3px; text-transform:uppercase; }
    .inp { width:100%; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); padding:9px 12px; color:var(--ink); font-size:14px; font-family:inherit; outline:none; transition:border-color .14s,box-shadow .14s; }
    .inp:focus { border-color:var(--primary-focus); box-shadow:0 0 0 2px rgba(94,106,210,.18); }
    .inp::placeholder { color:var(--ink-tertiary); }

    /* ── 에러 / 인포 메시지 ── */
    .auth-err { font-size:12px; color:var(--danger,#f87171); min-height:18px; margin-top:4px; }
    .auth-info { display:flex; align-items:center; gap:8px; padding:10px 14px; background:rgba(94,106,210,.08); border:1px solid rgba(94,106,210,.2); border-radius:var(--r-md); font-size:12px; color:var(--primary-hover); margin-bottom:18px; }
    .auth-alert { display:flex; align-items:center; gap:8px; padding:10px 14px; background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); border-radius:var(--r-md); font-size:12px; color:#f87171; margin-bottom:18px; }

    /* ── 비밀번호 강도 ── */
    .pw-strength { margin-top:6px; display:none; }
    .pw-strength-bar { height:3px; border-radius:99px; background:var(--hairline); overflow:hidden; }
    .pw-strength-fill { height:100%; border-radius:99px; transition:width .2s, background .2s; }
    .pw-strength-label { font-size:10px; color:var(--ink-tertiary); margin-top:3px; }

    /* ── 푸터 ── */
    .auth-footer { margin-top:16px; text-align:center; font-size:13px; color:var(--ink-tertiary); padding-top:16px; border-top:1px solid var(--hairline); }
    .auth-footer a { color:var(--primary); cursor:pointer; font-weight:500; }
    .auth-footer a:hover { color:var(--primary-hover); }

    /* ── Google SVG ── */
    .google-icon { flex-shrink:0; }
  </style>
</head>
<body>

<!-- 상단 바 -->
<div class="top-bar">
  <div class="wrap top-bar-inner">
    <a href="/kickoff" class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
      </svg>
      Kickoff
    </a>
    <a href="/kickoff" class="btn btn-ghost btn-sm">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 7H3M6 4L3 7l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      사이트로 돌아가기
    </a>
  </div>
</div>

<!-- 카드 영역 -->
<div class="auth-wrap">

  <!-- ──────────── 로그인 ──────────── -->
  <div id="loginCard">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
          <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
        </svg>
        Kickoff
      </div>
      <h1 class="auth-title">로그인</h1>
      <p class="auth-sub">Kickoff 계정으로 로그인해 콘텐츠를 관리하세요.</p>

      <!-- 오류/안내 배너 -->
      <div id="loginBanner" style="display:none;"></div>

      <!-- 어드민 리디렉트 안내 -->
      <div id="loginRedirectNote" class="auth-info" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M7 4v3.5l2 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        로그인 후 관리자 페이지로 이동합니다.
      </div>

      <!-- 구글 로그인 -->
      <button class="btn-google" onclick="googleLogin()">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2045C17.64 8.5664 17.5827 7.9527 17.4764 7.3636H9V10.845H13.8436C13.635 11.9700 13.0009 12.9232 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.2045Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.5932 3.68182 9C3.68182 8.4068 3.78409 7.83 3.96409 7.29V4.9582H0.957275C0.347727 6.1732 0 7.5477 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.5795C10.3214 3.5795 11.5077 4.0336 12.4405 4.9255L15.0218 2.3441C13.4632 0.8918 11.4259 0 9 0C5.48182 0 2.43818 2.0168 0.957275 4.9582L3.96409 7.29C4.67182 5.1627 6.65591 3.5795 9 3.5795Z" fill="#EA4335"/>
        </svg>
        Google로 계속하기
      </button>

      <div class="auth-divider"><span>또는</span></div>

      <!-- 이메일/아이디 + 비밀번호 -->
      <div class="auth-fields">
        <div class="field">
          <label>아이디 또는 이메일</label>
          <input class="inp" id="l-id" type="text" placeholder="username 또는 you@example.com" autocomplete="username" />
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input class="inp" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="auth-err" id="loginErr"></div>
      <div class="auth-footer">
        계정이 없으신가요? <a href="/kickoff/signup">회원가입</a>
      </div>
    </div>
  </div>

  <!-- ──────────── 회원가입 ──────────── -->
  <div id="signupCard" style="display:none;">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
          <path d="M10 2L17.32 6V14L10 18L2.68 14V6L10 2Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 6L14 8.5V13.5L10 16L6 13.5V8.5L10 6Z" fill="currentColor" opacity=".4"/>
        </svg>
        Kickoff
      </div>
      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">가입 후 편집자(Editor) 권한으로 시작합니다.<br>관리자 승급은 Admin이 처리합니다.</p>

      <!-- 구글 회원가입 -->
      <button class="btn-google" onclick="googleLogin()">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2045C17.64 8.5664 17.5827 7.9527 17.4764 7.3636H9V10.845H13.8436C13.635 11.9700 13.0009 12.9232 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.2045Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.5932 3.68182 9C3.68182 8.4068 3.78409 7.83 3.96409 7.29V4.9582H0.957275C0.347727 6.1732 0 7.5477 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.5795C10.3214 3.5795 11.5077 4.0336 12.4405 4.9255L15.0218 2.3441C13.4632 0.8918 11.4259 0 9 0C5.48182 0 2.43818 2.0168 0.957275 4.9582L3.96409 7.29C4.67182 5.1627 6.65591 3.5795 9 3.5795Z" fill="#EA4335"/>
        </svg>
        Google로 가입하기
      </button>

      <div class="auth-divider"><span>또는 이메일로 가입</span></div>

      <div class="auth-fields">
        <div class="field">
          <label>아이디 (영문, 숫자, _ / 3–30자)</label>
          <input class="inp" id="s-user" type="text" placeholder="username" autocomplete="username"
            oninput="validateUsername(this)" />
          <div class="auth-err" id="s-userErr"></div>
        </div>
        <div class="field">
          <label>이메일</label>
          <input class="inp" id="s-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>비밀번호 (8자 이상)</label>
          <input class="inp" id="s-pass" type="password" placeholder="••••••••" autocomplete="new-password"
            oninput="checkPwStrength(this.value)" />
          <div class="pw-strength" id="pwStrength">
            <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwFill"></div></div>
            <div class="pw-strength-label" id="pwLabel"></div>
          </div>
        </div>
        <div class="field">
          <label>비밀번호 확인</label>
          <input class="inp" id="s-pass2" type="password" placeholder="••••••••" autocomplete="new-password"
            oninput="checkPwMatch()" />
          <div class="auth-err" id="s-pw2Err"></div>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" id="signupBtn" onclick="doSignup()">가입하기</button>
      <div class="auth-err" id="signupErr"></div>
      <div class="auth-footer">
        이미 계정이 있으신가요? <a href="/kickoff/login">로그인</a>
      </div>
    </div>
  </div>

</div>

<!-- 최소 푸터 -->
<div style="padding:20px;text-align:center;border-top:1px solid var(--hairline);">
  <span style="font-size:12px;color:var(--ink-tertiary);">© 2026 Kickoff · <a href="/kickoff" style="color:var(--ink-tertiary);">메인으로</a></span>
</div>

<script>
/* ── URL 파라미터 ── */
const params   = new URLSearchParams(location.search);
const redirect = params.get('redirect') || '/kickoff';
const errParam = params.get('error');

/* ── URL 오류 메시지 표시 ── */
const ERROR_MSGS = {
  google_not_configured: 'Google 로그인이 아직 설정되지 않았습니다.',
  google_denied:         'Google 로그인이 취소됐습니다.',
  invalid_state:         '보안 확인에 실패했습니다. 다시 시도해주세요.',
  oauth_failed:          'Google 로그인 중 오류가 발생했습니다.',
};
if (errParam && ERROR_MSGS[errParam]) {
  const banner = document.getElementById('loginBanner');
  banner.className = 'auth-alert';
  banner.innerHTML = `<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M7 4.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="9.5" r=".7" fill="currentColor"/></svg>${ERROR_MSGS[errParam]}`;
  banner.style.display = 'flex';
}

/* ── 이미 로그인 → 바로 이동 ── */
(async function checkExisting() {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (r.ok) goAfterLogin(await r.json());
  } catch (_) {}
})();

/* ── 어드민 리디렉트 안내 ── */
if (redirect.includes('admin'))
  document.getElementById('loginRedirectNote').style.display = 'flex';

/* ── 카드 전환 ── */
function showCard(name) {
  document.getElementById('loginCard').style.display  = name === 'login'  ? '' : 'none';
  document.getElementById('signupCard').style.display = name === 'signup' ? '' : 'none';
  document.getElementById('loginErr').textContent  = '';
  document.getElementById('signupErr').textContent = '';
}

/* ── 로그인 후 이동 ── */
function goAfterLogin(user) {
  if (user.role === 'admin') {
    window.location.href = redirect.startsWith('/kickoff') ? redirect : '/kickoff/admin';
  } else {
    window.location.href = redirect.startsWith('/kickoff') ? redirect : '/kickoff';
  }
}

/* ── Google 로그인 ── */
function googleLogin() {
  window.location.href = '/api/auth/google?redirect=' + encodeURIComponent(redirect);
}

/* ── 이메일/아이디 로그인 ── */
async function doLogin() {
  const identifier = document.getElementById('l-id').value.trim();
  const password   = document.getElementById('l-pass').value;
  const errEl      = document.getElementById('loginErr');
  if (!identifier || !password) { errEl.textContent = '아이디/이메일과 비밀번호를 입력하세요.'; return; }
  errEl.textContent = '';

  const btn = document.getElementById('loginBtn');
  btn.textContent = '로그인 중...'; btn.disabled = true;

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, password }),
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error; return; }
    goAfterLogin(d.user);
  } catch {
    errEl.textContent = '서버 오류가 발생했습니다.';
  } finally {
    btn.textContent = '로그인'; btn.disabled = false;
  }
}

/* ── 회원가입 ── */
async function doSignup() {
  const username = document.getElementById('s-user').value.trim();
  const email    = document.getElementById('s-email').value.trim();
  const password = document.getElementById('s-pass').value;
  const pass2    = document.getElementById('s-pass2').value;
  const errEl    = document.getElementById('signupErr');

  if (!username || !email || !password) { errEl.textContent = '모든 항목을 입력하세요.'; return; }
  if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) { errEl.textContent = '아이디는 영문, 숫자, _만 사용 (3–30자).'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = '올바른 이메일 주소를 입력하세요.'; return; }
  if (password.length < 8) { errEl.textContent = '비밀번호는 8자 이상이어야 합니다.'; return; }
  if (password !== pass2) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
  errEl.textContent = '';

  const btn = document.getElementById('signupBtn');
  btn.textContent = '가입 중...'; btn.disabled = true;

  try {
    const r = await fetch('/api/auth/signup', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password }),
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error; return; }
    goAfterLogin(d.user);
  } catch {
    errEl.textContent = '서버 오류가 발생했습니다.';
  } finally {
    btn.textContent = '가입하기'; btn.disabled = false;
  }
}

/* ── 실시간 아이디 검증 ── */
function validateUsername(input) {
  const v = input.value.trim();
  const errEl = document.getElementById('s-userErr');
  if (!v) { errEl.textContent = ''; return; }
  errEl.textContent = /^[a-zA-Z0-9_]{3,30}$/.test(v)
    ? '' : '영문, 숫자, _ 만 사용 (3–30자)';
}

/* ── 비밀번호 강도 표시 ── */
function checkPwStrength(pw) {
  const el = document.getElementById('pwStrength');
  const fill = document.getElementById('pwFill');
  const label = document.getElementById('pwLabel');
  if (!pw) { el.style.display = 'none'; return; }
  el.style.display = 'block';

  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    { pct:'20%', color:'#f87171', text:'매우 약함' },
    { pct:'40%', color:'#fb923c', text:'약함' },
    { pct:'60%', color:'#fbbf24', text:'보통' },
    { pct:'80%', color:'#4ade80', text:'강함' },
    { pct:'100%',color:'#22c55e', text:'매우 강함' },
  ];
  const lv = levels[Math.min(score, 4)];
  fill.style.width = lv.pct;
  fill.style.background = lv.color;
  label.textContent = lv.text;
  label.style.color = lv.color;
}

/* ── 비밀번호 확인 실시간 ── */
function checkPwMatch() {
  const pw1 = document.getElementById('s-pass').value;
  const pw2 = document.getElementById('s-pass2').value;
  const errEl = document.getElementById('s-pw2Err');
  if (!pw2) { errEl.textContent = ''; return; }
  errEl.textContent = pw1 === pw2 ? '' : '비밀번호가 일치하지 않습니다.';
}

/* ── 엔터키 지원 ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('signupCard').style.display !== 'none') doSignup();
  else doLogin();
});
</script>
</body>
</html>
